name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Forbidden files (secrets, profile, resume, db)
        run: python scripts/check_forbidden_files.py

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Format check (ruff)
        run: ruff format --check app tests scripts

      - name: Type check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        env:
          # No API keys needed — all LLM/search calls are mocked (see
          # tests/conftest.py). CELERY_TASK_ALWAYS_EAGER defaults to true,
          # so no Redis is needed either.
          SECRET_KEY: ci-test-secret-not-for-production
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check + build (tsc + vite)
        run: npm run build

      - name: Test (vitest)
        run: npm run test
