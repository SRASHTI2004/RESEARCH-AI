# Example master resume — copy to data/private/master_resume.yaml
# (git-ignored; scripts/check_forbidden_files.py blocks it from commits)
# and replace EVERYTHING with your real details.
#
# This is the single source of truth for resume tailoring: a tailored
# version can only reorder and reword what's written here. It can never
# add a skill, number, project or job that isn't in this file — so put in
# everything true you might want to use, and nothing that isn't.
#
# Tips:
# - `id`s must be unique and stable (they link tailored bullets back to
#   their originals for the diff and the no-invention checks).
# - List each project's/job's real `tech`. A rewritten bullet may only
#   mention technologies from its own item's bullets or `tech` list.
# - Use real numbers only ("cut load time from 4s to 1.5s"); the tailor
#   can't add numbers that aren't already in that bullet.

contact:
