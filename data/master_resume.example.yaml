    name: ResearchAI — Company Research Brief
    link: "https://github.com/your-handle/researchai"
    tech: [Python, FastAPI, React, TypeScript, LangGraph, SQLAlchemy, Alembic, Celery, Docker, GitHub Actions]
    bullets:
      - Built a multi-agent LLM pipeline with LangGraph that researches a company via web search and writes a cited brief.
      - Added JWT auth, role-based access control and per-user job history with SQLAlchemy and Alembic migrations.
      - Built a React + TypeScript frontend with live progress polling and set up CI with GitHub Actions.

