# Company watchlist for the official ATS job-board sources.
#
# Each entry: name (display name), ats (greenhouse | lever | ashby), board
# (the company's board token — the slug in their careers URL):
#   Greenhouse: https://boards.greenhouse.io/<board>   or boards-api.greenhouse.io/v1/boards/<board>/jobs
#   Lever:      https://jobs.lever.co/<board>
#   Ashby:      https://jobs.ashbyhq.com/<board>
#
# Every board below was verified to respond on 2026-10-03. A board that
# later 404s (company switched ATS) is logged and skipped — it never breaks
# the rest of the run. Add/remove freely.

