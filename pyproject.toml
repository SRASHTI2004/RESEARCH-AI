[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501", # line length — handled by the formatter, not worth failing CI over
    "B008", # FastAPI's idiomatic `Depends(...)` default-arg pattern, not a bug here
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "."
exclude = ["alembic/versions", "venv", "frontend"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true
